<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#ffb7c5" />
    <meta
      name="description"
      content="AI Restaurant Battle — a 3D restaurant management battle against five AI rivals."
    />
    <title>AI Restaurant Battle</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="scene" class="scene"></div>
    <p id="scene-fallback" class="scene-fallback" data-i18n="noWebGL" hidden></p>

    <main id="title-screen" class="title-screen"></main>

    <div id="game-ui" class="game-ui" hidden>
      <header id="hud" class="hud glass"></header>
      <div id="stage" class="stage" aria-hidden="true"></div>
      <aside id="left-panel" class="panel panel-left glass" aria-labelledby="left-panel-title">
        <span id="left-panel-title" class="visually-hidden" data-i18n="rankingTitle"
          >Live ranking</span
        >
      </aside>
      <aside id="right-panel" class="panel panel-right glass" aria-labelledby="right-panel-title">
        <span id="right-panel-title" class="visually-hidden" data-i18n="advisorRole"
          >AI business advisor</span
        >
      </aside>
      <section id="dock" class="dock glass" aria-labelledby="dock-title">
        <span id="dock-title" class="visually-hidden" data-i18n="tabs.menu">Menu</span>
      </section>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <noscript>AI Restaurant Battle needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
